# Integration tests hit live Flare RPC endpoints, so they are excluded from the
# default run: `dart test` stays hermetic, fast and green offline.
#
#   dart test                  # unit only
#   dart test -P integration   # live Coston2
#   dart test -P mainnet       # live mainnet reads (slower, rate-limited)
#
# A preset replaces the top-level exclude_tags, which is what lets one config
# serve both the hermetic default and the opt-in live runs. Note these are
# presets (-P), not tag selectors (-t): passing `-t integration` would be
# rejected as conflicting with the exclusion below.
exclude_tags: integration || mainnet

presets:
  integration:
    include_tags: integration
    exclude_tags: mainnet
  mainnet:
    include_tags: mainnet
    exclude_tags: integration

tags:
  integration:
    timeout: 2x
  mainnet:
    timeout: 3x
