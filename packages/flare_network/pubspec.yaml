name: flare_network
description: >-
  Dart client for Flare Network. Resolve contracts through the Flare Contract
  Registry, read FTSOv2 price feeds, and call any Flare contract over JSON-RPC.
  Pure Dart, with no Flutter dependency.
version: 0.1.0-dev.1
repository: https://github.com/Immadominion/flare-dart
issue_tracker: https://github.com/Immadominion/flare-dart/issues
topics:
  - flare
  - blockchain
  - ethereum
  - oracle

environment:
  sdk: ^3.7.0

dependencies:
  http: ^1.6.0
  # Deliberately loose. The Flutter SDK pins `meta` (1.18.0 as of Flutter
  # 3.38), so a `^1.19.0` constraint makes this package unresolvable from every
  # Flutter app — which is the main audience. Only widen the floor here for an
  # API this package actually uses.
  meta: ^1.15.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.2
